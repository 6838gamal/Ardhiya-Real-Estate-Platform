services:
  app:
    build: .
    container_name: ardiya_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ardiya_db
    environment:
      POSTGRES_USER: ${DB_USER:-ardiya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ardiya_secret}
      POSTGRES_DB: ${DB_NAME:-ardiya_db}
    ports:
      - "5432:5432"
    volumes:
      - ardiya_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ardiya} -d ${DB_NAME:-ardiya_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ardiya_db_data:
