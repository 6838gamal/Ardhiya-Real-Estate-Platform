{% extends "base.html" %}

{% block content %}
<section class="page-section">
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">{{ _('nav.properties') }}</h1>
            <p class="page-subtitle">{{ _('common.coming_soon') }}</p>
        </div>

        <div class="filter-bar">
            <div class="filter-item">
                <select class="filter-select" aria-label="{{ _('property.type') }}">
                    <option value="">{{ _('property.type') }}</option>
                    <option value="apartment">{{ _('property.type.apartment') }}</option>
                    <option value="villa">{{ _('property.type.villa') }}</option>
                    <option value="land">{{ _('property.type.land') }}</option>
                    <option value="office">{{ _('property.type.office') }}</option>
                    <option value="shop">{{ _('property.type.shop') }}</option>
                </select>
            </div>
            <div class="filter-item">
                <select class="filter-select" aria-label="{{ _('property.status.for_sale') }}">
                    <option value="">{{ _('property.status.for_sale') }}</option>
                    <option value="rent">{{ _('property.status.for_rent') }}</option>
                    <option value="sold">{{ _('property.status.sold') }}</option>
                </select>
            </div>
            <button class="btn btn-outline">{{ _('common.filter') }}</button>
        </div>

        <div class="empty-state">
            <div class="empty-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                    <path d="M9 22V12h6v10"/>
                </svg>
            </div>
            <h2>{{ _('home.no_properties') }}</h2>
            <p>{{ _('common.coming_soon') }}</p>
        </div>
    </div>
</section>
{% endblock %}
